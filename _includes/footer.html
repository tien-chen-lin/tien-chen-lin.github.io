<footer class="site-footer">
  <div class="footer-grid">
    <div>
      <h5>About</h5>
      <p>
        {{ site.name }}<br>
        {{ site.title }}<br>
        {{ site.institution }}
      </p>
    </div>
    <div>
      <h5>Contact</h5>
      <p>
        <a href="mailto:{{ site.email }}"><i class="fa-solid fa-envelope"></i> {{ site.email }}</a><br>
      </p>
    </div>
    <div>
      <h5>Explore</h5>
      <p>
        <a href="{{ '/research/' | relative_url }}">Research program</a><br>
        <a href="{{ '/research/#media' | relative_url }}">Animations &amp; recorded talk</a><br>
        <a href="{{ '/futurelab/' | relative_url }}">Independent group &amp; mentoring</a>
      </p>
    </div>
  </div>
  <div class="footer-profiles">{% include profile-links.html %}</div>
  <div class="footer-grid">
    <div class="footer-copyright" style="grid-column: 1 / -1;">
      &copy; {{ "now" | date: "%Y" }} {{ site.name | escape }}
    </div>
  </div>
</footer>

<script src="{{ "/assets/javascript/bootstrap/bootstrap.bundle.min.js" | relative_url }}"></script>
<script src="{{ "/assets/js/site.min.js" | relative_url }}"></script>
<script>
  // Reduced-motion: don't autoplay looping videos; expose controls instead.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('video[autoplay]').forEach(function (v) {
      v.removeAttribute('autoplay'); v.setAttribute('controls', ''); try { v.pause(); } catch (e) {}
    });
  }
</script>
<script>
  // Click-to-load YouTube facade — no third-party iframe/cookies until play.
  document.querySelectorAll('.yt-embed').forEach(function (el) {
    var loaded = false;
    function load() {
      if (loaded) return;
      loaded = true;
      var id = el.getAttribute('data-ytid');
      el.removeAttribute('role');
      el.removeAttribute('tabindex');
      el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1&rel=0" title="Recorded talk" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    }
    el.addEventListener('click', load, { once: true });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); }
    });
  });
</script>
